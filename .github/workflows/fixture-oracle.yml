name: fixture-oracle
on:
  pull_request:
  push:
    branches: [main, 'issue-16-*']
permissions:
  contents: read
jobs:
  external-oracle:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tools/fixture-oracle.test.mjs
