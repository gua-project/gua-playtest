name: foundation
on:
  pull_request:
  push:
    branches: [main, 'issue-3-*']
permissions:
  contents: read
jobs:
  build-test-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-22.04
            rid: linux-x64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-15
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.301
      - name: Dependency boundaries
        shell: pwsh
        run: ./scripts/check-boundaries.ps1
      - run: dotnet restore --locked-mode
      - run: dotnet build --no-restore -c Release
      - name: Test every project sequentially
        shell: pwsh
        run: ./scripts/test-projects.ps1
      - name: Actual archive and tool smoke
        shell: pwsh
        run: ./scripts/package-smoke.ps1 -Rid '${{ matrix.rid }}'
      - name: Published native-free contract validation
        shell: pwsh
        run: ./scripts/contract-smoke.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-${{ matrix.rid }}-${{ github.sha }}
          path: |
            artifacts/tests/*.trx
            artifacts/tests/runtime-evidence/**
            artifacts/tests/single-ui/**
            # Keep only Replay diagnostics/summaries. Never publish the private
            # Plan authority key, candidate graph or Recording input contents.
            artifacts/tests/replay-runtime/*/command.json
            artifacts/tests/replay-runtime/*/accepted-command.json
            artifacts/tests/replay-runtime/**/primary.json
            artifacts/tests/replay-runtime/**/completion.json
            artifacts/tests/replay-runtime/**/result.json
            artifacts/tests/scripted-explore/*/command.json
            artifacts/tests/scripted-explore/**/primary.json
            artifacts/tests/scripted-explore/**/completion.json
            artifacts/tests/scripted-explore/**/result.json
            artifacts/smoke-*/evidence.json
            artifacts/smoke-*/*.zip
            artifacts/smoke-*/feed/*.nupkg
            artifacts/contracts-*/evidence.json
            **/packages.lock.json
          if-no-files-found: error
